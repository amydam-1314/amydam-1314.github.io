  <rect width="1600" height="1000" fill="url(#lines)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.16" style="mix-blend-mode:overlay"/>
  <path d="M0 780C240 720 420 860 700 800s520-180 900-110v310H0Z" fill="#05090F" opacity="0.55"/>
