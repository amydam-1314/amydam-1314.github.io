  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="300" cy="180" rx="520" ry="360" fill="url(#g1)"/>
    <ellipse cx="1260" cy="330" rx="460" ry="300" fill="url(#g3)"/>
    <ellipse cx="900" cy="890" rx="620" ry="280" fill="url(#g2)"/>
