<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="m0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1730"/>
      <stop offset="100%" stop-color="#050A14"/>
    </linearGradient>
    <radialGradient id="b1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4338CA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4338CA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <filter id="mix" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <filter id="grain3">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#m0)"/>
  <g filter="url(#mix)">
    <ellipse cx="330" cy="260" rx="560" ry="400" fill="url(#b1)"/>
    <ellipse cx="1240" cy="200" rx="480" ry="340" fill="url(#b3)"/>
    <ellipse cx="1180" cy="820" rx="560" ry="360" fill="url(#b2)"/>
    <ellipse cx="380" cy="880" rx="440" ry="300" fill="url(#b4)"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain3)" opacity="0.2" style="mix-blend-mode:overlay"/>

  <!-- 细斜纹 -->
  <g stroke="#8FB6FF" stroke-opacity="0.05" stroke-width="1">
    <path d="M-200 1100 L900 -100 M-100 1100 L1000 -100 M0 1100 L1100 -100 M100 1100 L1200 -100 M200 1100 L1300 -100 M300 1100 L1400 -100 M400 1100 L1500 -100 M500 1100 L1600 -100 M600 1100 L1700 -100 M700 1100 L1800 -100"/>
  </g>
</svg>
