<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2F6FD"/>
      <stop offset="50%" stop-color="#E6EEFA"/>
      <stop offset="100%" stop-color="#DCE8F9"/>
    </linearGradient>
    <filter id="smooth">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bgc)"/>

  <!-- 等高线：同心椭圆描边 -->
  <g fill="none" stroke="#2E6FE0" filter="url(#smooth)">
    <g stroke-opacity="0.34" stroke-width="1.1">
      <ellipse cx="520" cy="470" rx="90" ry="64"/>
      <ellipse cx="520" cy="470" rx="140" ry="100"/>
      <ellipse cx="520" cy="470" rx="195" ry="140"/>
      <ellipse cx="520" cy="470" rx="250" ry="180"/>
      <ellipse cx="520" cy="470" rx="305" ry="220"/>
      <ellipse cx="520" cy="470" rx="360" ry="260"/>
    </g>
    <g stroke-opacity="0.22" stroke-width="1" transform="translate(760 120)">
      <ellipse cx="420" cy="420" rx="120" ry="86"/>
      <ellipse cx="420" cy="420" rx="185" ry="132"/>
      <ellipse cx="420" cy="420" rx="250" ry="178"/>
      <ellipse cx="420" cy="420" rx="315" ry="224"/>
      <ellipse cx="420" cy="420" rx="380" ry="270"/>
      <ellipse cx="420" cy="420" rx="445" ry="316"/>
    </g>
    <g stroke-opacity="0.14" stroke-width="1" transform="translate(-180 420)">
      <ellipse cx="300" cy="380" rx="160" ry="110"/>
      <ellipse cx="300" cy="380" rx="240" ry="165"/>
      <ellipse cx="300" cy="380" rx="320" ry="220"/>
      <ellipse cx="300" cy="380" rx="400" ry="275"/>
    </g>
  </g>

  <!-- 高光点 -->
  <g fill="#1E4FD8">
    <circle cx="520" cy="470" r="4" opacity="0.55"/>
    <circle cx="1180" cy="540" r="3" opacity="0.4"/>
    <circle cx="120" cy="800" r="2.5" opacity="0.35"/>
  </g>
</svg>
