# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: 小舟的笔记
subtitle: '把踩过的坑，留成能复用的路'
description: '技术笔记：密码学、逆向、前端工程与那些让人熬夜的边界情况。'
keywords: 技术笔记,密码学,CTF,逆向
author: 小舟
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## 部署在 <用户名>.github.io 仓库，站点在根路径
url: https://amydam-1314.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
marked:
  prependRoot: true
  postAsset: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: butterfly

# Search
search:
  path: search.xml
  field: post
  content: true
  format: html

# Deployment
deploy:
  type: ''
